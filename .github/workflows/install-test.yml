name: Install test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Verify that an end-user `pip install <wheel>` works on a clean machine
# with no source tree present. This is the gate that would have caught
# the v2.16 C1 bug where templates/ was not packaged in the wheel.

jobs:
  wheel-install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install wheel in a clean venv (outside source tree)
        run: |
          mkdir /tmp/halyard-install-test
          cd /tmp/halyard-install-test
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install $GITHUB_WORKSPACE/dist/*.whl
          echo "VENV=/tmp/halyard-install-test/.venv" >> $GITHUB_ENV

      - name: Smoke test — halyard --version
        run: |
          cd /tmp/halyard-install-test
          $VENV/bin/halyard --version

      - name: Smoke test — halyard init in a clean project
        run: |
          mkdir /tmp/halyard-install-test/sample-project
          cd /tmp/halyard-install-test/sample-project
          $VENV/bin/halyard init --no-interactive

      - name: Smoke test — halyard invoice renders (templates packaged)
        run: |
          cd /tmp/halyard-install-test/sample-project
          # Create a minimal client + project + one logged session so invoice has data.
          # Project slugs are unscoped (see orchestration._PROJECTS_TOML template);
          # the composite client:project form is only used in timeclock account
          # names. A scoped slug like "acme:web" silently produces a $0.00 invoice
          # because no project matches the lookup — the assertion below catches
          # that regression class.
          cat > clients.toml <<'EOF'
          [[client]]
          slug = "acme"
          name = "Acme Co"
          address = "1 Main St"
          email = "billing@acme.example"
          EOF
          cat > projects.toml <<'EOF'
          [[project]]
          slug = "web"
          client_slug = "acme"
          name = "Acme Web"
          hourly_rate = 150.0
          EOF
          cat > time.timeclock <<'EOF'
          i 2026-01-01 09:00:00 acme:web
          o 2026-01-01 10:00:00
          EOF
          # halyard invoice renders the invoice markdown via the Jinja template.
          # Failure here would mean templates/invoice.md.j2 was not packaged in
          # the wheel (the v2.16 C1 bug). Capture stdout so we can assert the
          # rendered total is the expected $150.00 (1 hr × $150/hr) — a $0.00
          # render means slug/account mismatch silently swallowed the entries.
          out=$($VENV/bin/halyard invoice acme --month 2026-01 --dry-run)
          echo "$out"
          echo "$out" | grep -qF 'Total: USD 150.00' || {
            echo "ERROR: expected 'Total: USD 150.00' in invoice output; got above"
            exit 1
          }
