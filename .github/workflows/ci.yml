name: CI

# Action pins: every `uses:` is pinned to an immutable commit SHA, not a
# moving tag (@v4 lets the upstream owner change what runs in our CI). The
# trailing comment records the human-readable version for review/renovate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with ruff
        run: ruff format --check .

      - name: Type-check with mypy
        run: mypy src

      - name: Test with pytest
        run: pytest --cov=halyard --cov-report=term-missing

      - name: Audit dependencies for known CVEs
        # Audit the installed environment directly. The previous form
        # (`--requirement <(pip freeze)`) drove pip-audit into its
        # ephemeral-venv mode, where `pip freeze`'s rendering of an
        # editable install as `halyard @ git+https://...` made
        # --skip-editable miss it; pip-audit then tried to clone that
        # URL into the sandbox and failed on non-interactive auth.
        # Inspecting the current env in place avoids the re-resolution
        # entirely; --skip-editable still skips the local halyard.
        run: pip-audit --skip-editable

  # Real-Windows coverage for the platform-specific file-locking path
  # (_acquire_read_lock / _release_read_lock — the v5.9 read-lock crash site).
  # Runs only the suite; lint/format/mypy/audit are platform-independent and
  # stay on ubuntu above. Required since v5.12 iter 2 (encoding + LF + EACCES
  # + hook/copilot path fixes brought it from 60+ failures to green).
  test-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test with pytest
        run: pytest -q

  # Compile, test, and audit the TypeScript VS Code extension under
  # vscode-extension/. The Python jobs above never exercise it, so a broken
  # build or a high/critical npm advisory would otherwise ship unnoticed.
  vscode-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Test with vitest
        run: npm test

      - name: Audit npm dependencies
        # Fail on high/critical advisories. Moderate dev-only advisories (e.g.
        # esbuild via vitest, which never ships in the .vsix — src/ and
        # node_modules/ are excluded by .vscodeignore) do not gate the build.
        run: npm audit --audit-level=high
