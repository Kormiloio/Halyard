name: CI

# Action pins: every `uses:` is pinned to an immutable commit SHA, not a
# moving tag (@v4 lets the upstream owner change what runs in our CI). The
# trailing comment records the human-readable version for review/renovate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # setuptools is upgraded alongside pip because the 3.11 runner
        # image ships 79.0.1, which carries PYSEC-2026-3447 (fixed in
        # 83.0.0). The audit step below inspects the environment in
        # place, so a stale build-time setuptools fails CI on 3.11 even
        # though halyard neither depends on nor imports it. Pinning it in
        # pyproject would be wrong — it is a runner artifact, not a
        # project dependency. Only this job needs it; test-windows does
        # not audit.
        #
        # `[all]` is installed alongside `[dev]` so the audit step sees
        # the optional dependency surface. Until v5.30 this was `[dev]`
        # only, so pip-audit never saw the `mcp` extra or anything under
        # it — mcp, starlette, cryptography, pyjwt, python-multipart,
        # msgpack — i.e. exactly the packages behind the Hub's
        # network-facing code. 27 advisories sat open there while CI
        # reported the dependency audit green. The clean no-extras
        # install path stays covered by install-test.yml.
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev,all]"

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with ruff
        run: ruff format --check .

      - name: Type-check with mypy
        run: mypy src

      - name: Test with pytest
        run: pytest --cov=halyard --cov-report=term-missing

      - name: Audit dependencies for known CVEs
        # Audit the installed environment directly. The previous form
        # (`--requirement <(pip freeze)`) drove pip-audit into its
        # ephemeral-venv mode, where `pip freeze`'s rendering of an
        # editable install as `halyard @ git+https://...` made
        # --skip-editable miss it; pip-audit then tried to clone that
        # URL into the sandbox and failed on non-interactive auth.
        # Inspecting the current env in place avoids the re-resolution
        # entirely; --skip-editable still skips the local halyard.
        run: pip-audit --skip-editable

  # Real-Windows coverage for the platform-specific file-locking path
  # (_acquire_read_lock / _release_read_lock — the v5.9 read-lock crash site).
  # Runs only the suite; lint/format/mypy/audit are platform-independent and
  # stay on ubuntu above. Required since v5.12 iter 2 (encoding + LF + EACCES
  # + hook/copilot path fixes brought it from 60+ failures to green).
  test-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test with pytest
        run: pytest -q

  # Compile, test, and audit the TypeScript VS Code extension under
  # vscode-extension/. The Python jobs above never exercise it, so a broken
  # build or a high/critical npm advisory would otherwise ship unnoticed.
  vscode-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Test with vitest
        run: npm test

      - name: Audit npm dependencies
        # Fail on high/critical advisories. Moderate dev-only advisories (e.g.
        # esbuild via vitest, which never ships in the .vsix — src/ and
        # node_modules/ are excluded by .vscodeignore) do not gate the build.
        run: npm audit --audit-level=high
