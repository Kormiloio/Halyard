[project]
name = "halyard"
version = "0.1.0"
description = "Plain-text, agent-native financial OS for freelancers."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Kormilo LLC" }]
keywords = ["freelance", "invoicing", "time-tracking", "accounting", "plaintext", "agent", "claude"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "tomli>=2.0; python_version<'3.11'",
    "tomli-w>=1.0",
    "jinja2>=3.1",
    "dateparser>=1.2",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "textual>=0.60",
    "watchfiles>=0.21",
]
openai = ["openai>=1.0"]
tui = [
    "textual>=0.60",
    "watchfiles>=0.21",
]
all = ["textual>=0.60", "watchfiles>=0.21", "openai>=1.0"]

[project.scripts]
halyard = "halyard.cli:app"

[project.urls]
Homepage = "https://github.com/Kormiloio/Halyard"
Repository = "https://github.com/Kormiloio/Halyard"
Issues = "https://github.com/Kormiloio/Halyard/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halyard"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["B008"]  # typer.Option/Argument in defaults is the required Typer pattern

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
