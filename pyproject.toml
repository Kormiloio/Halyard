[project]
name = "halyard"
version = "0.2.0"
description = "Your AI work leaves a trail. Halyard makes that trail legible, auditable, and client-safe."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Kormilo LLC", email = "mcamaj@gmail.com" }]
keywords = ["ai-work-intelligence", "ai-observability", "claude", "cursor", "copilot", "gemini", "plaintext", "agent", "ai-spend", "invoicing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "tomli-w>=1.0",
    "jinja2>=3.1",
    "dateparser>=1.2",
    "anthropic>=0.40",
    "textual>=0.60",
    "watchfiles>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.15.12",
    "mypy>=1.10",
    "pip-audit>=2.7",  # L-4: CVE scanning for dependencies
]
openai = ["openai>=1.0"]
mcp = ["mcp>=1.2"]
all = ["openai>=1.0", "mcp>=1.2"]

[project.scripts]
halyard = "halyard.cli:main"

[project.urls]
Homepage = "https://kormilo.io/halyard"
Repository = "https://github.com/Kormiloio/Halyard"
Issues = "https://github.com/Kormiloio/Halyard/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halyard"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["B008"]  # typer.Option/Argument in defaults is the required Typer pattern

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

# Optional MCP SDK has no type stubs and is not installed in the core
# environment; its absence must not fail the type gate.
[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "halyard.mcp_server"
disable_error_code = ["untyped-decorator"]
