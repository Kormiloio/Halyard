[project]
name = "halyard"
version = "0.2.8"
description = "Your AI work leaves a trail. Halyard makes that trail legible, auditable, and client-safe."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Kormilo LLC", email = "mcamaj@gmail.com" }]
keywords = ["ai-work-intelligence", "ai-observability", "claude", "cursor", "copilot", "gemini", "plaintext", "agent", "ai-spend", "invoicing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.7,<15",
    "pydantic>=2.6,<3",
    "tomli-w>=1.2.0,<2",
    "jinja2>=3.1,<4",
    "dateparser>=1.2,<2",
    "anthropic>=0.40,<1.0",
    "textual>=0.60,<2.0",
    "watchfiles>=1.2.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
    "ruff==0.15.12",
    "mypy>=2.1.0",
    "pip-audit>=2.10.1",  # L-4: CVE scanning for dependencies
    "freezegun>=1.5",  # v5.14: pin wall clock in May-2026-anchored tests
]
openai = ["openai>=1.0"]
# Lower bound clears PYSEC-2026-3481/3482/3483. Upper bound is load-bearing:
# mcp 2.x renamed FastMCP -> MCPServer, so `mcp.server.fastmcp` (imported in
# mcp_server.py) does not exist there and `halyard mcp` dies on import. The
# old `>=1.2` let a fresh install resolve 2.x and ship a broken server that
# no test covers — see openspec/changes/v5.30-audit-full-dependency-surface/.
mcp = ["mcp>=1.28.1,<2"]
all = ["openai>=1.0", "mcp>=1.28.1,<2"]

[project.scripts]
halyard = "halyard.cli:main"

[project.urls]
Homepage = "https://kormilo.io/halyard"
Repository = "https://github.com/Kormiloio/Halyard"
Issues = "https://github.com/Kormiloio/Halyard/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halyard"]

[tool.hatch.build.targets.sdist]
# Without an explicit list hatchling ships the entire repo (openspec/, docs/,
# vscode-extension/, ...). The sdist needs only what a from-source build and
# test run require: the package, the test suite, and samples/ (asserted to
# exist by test_v41_polyglot). pyproject.toml, README, and LICENSE are
# auto-included by hatchling.
include = [
    "/src/halyard",
    "/tests",
    "/samples",
    "/CHANGELOG.md",
    "/SECURITY.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["B008"]  # typer.Option/Argument in defaults is the required Typer pattern
# Future: enable PLW1514 (open without explicit encoding) once it graduates from
# ruff preview, to keep the v5.12 UTF-8 invariant locked in.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

# Optional MCP SDK has no type stubs and is not installed in the core
# environment; its absence must not fail the type gate.
[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "halyard.mcp_server"
disable_error_code = ["untyped-decorator"]
